<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#07090c">
<title>Clash Sonore · Tournoi de musique</title>
<meta name="description" content="Fais s'affronter les titres les plus écoutés d'un artiste et trouve ton préféré.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%2307090c' stroke='%2322e36b' stroke-width='4'/%3E%3Ctext x='32' y='42' font-size='26' font-family='Arial Black,Arial' font-weight='900' text-anchor='middle' fill='%2322e36b'%3EVS%3C/text%3E%3C/svg%3E">
</head>
<body>
<header class="top">
  <button class="back" id="back" type="button" hidden>← Retour</button>
  <a class="logo" href="./" aria-label="Clash Sonore, accueil"><span class="logo-vs">VS</span>Clash<b>Sonore</b></a>
  <div class="vol" role="group" aria-label="Volume">
    <button class="vol-btn" id="mute" type="button" aria-label="Couper le son"></button>
    <input id="volume" type="range" min="0" max="100" step="1" value="50" aria-label="Volume des extraits">
    <span class="vol-val" id="vol-val">50%</span>
  </div>
</header>

<main id="app" aria-live="polite"></main>

<footer class="foot">Données et extraits audio : <a href="https://www.deezer.com" target="_blank" rel="noopener">Deezer</a>. Classement selon la popularité Deezer.</footer>

<div class="toast" id="toast" role="status" hidden></div>

<script src="app.js"></script>
</body>
</html>
