<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCEND · Histoire du héros</title>
<link rel="stylesheet" href="ascend.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("ascend-theme");document.documentElement.dataset.theme=/^(sombre|encre|fenetre|anime|carnet|claire)$/.test(t)?t:"equilibre"}catch(e){document.documentElement.dataset.theme="equilibre"}</script>
<style>
.chap{border-bottom:1px solid var(--line-soft);padding:14px 0}
.chap h2{margin:0 0 8px;font:700 20px var(--fd);color:var(--gold)}
.chap p{margin:0 0 10px;font:500 18px/1.6 var(--fu);color:var(--tx)}
.chap.locked h2{color:var(--tx3)}
.chap.locked p{color:var(--tx3);font-size:15px}
</style>
</head>
<body>
<div class="scr">
<div class="stars"></div><div class="speed"></div><div class="halftone"></div>
<main class="page" id="root"><p class="empty">Chargement…</p></main>
</div>
<script src="pont.js"></script>
<script src="app.js"></script>
<script>
"use strict";
const root = document.getElementById("root");
(async () => {
  const state = await api("/api/state");
  if (!state.hero) { location.href = "index.html"; return; }
  mount("histoire.html", state);
  const L = await api("/api/lore");
  root.replaceChildren(el("section", {class: "col", style: "max-width:820px;margin:0 auto;width:100%"},
    heroTabs("histoire.html"),
    el("div", {class: "pn pb"},
      el("div", {class: "slant", style: "align-self:flex-start;margin-bottom:8px"}, el("span", {}, "L'Ascension")),
      el("p", {class: "tx2", style: "margin:0"}, `Chapitres débloqués : ${L.unlocked} / ${L.chapters.length}. Un nouveau chapitre s'ouvre à certains niveaux` +
        (L.next ? ` (prochain : « ${L.next.title} » au niveau ${L.next.level}, tu es niveau ${L.level}).` : ".")),
      el("p", {class: "tx3", style: "margin:6px 0 0;font-size:14px"}, "Version provisoire de l'histoire : elle sera enrichie plus tard."),
      L.chapters.map(c => el("article", {class: "chap" + (c.unlocked ? "" : " locked")},
        el("h2", {}, `Chapitre ${c.n} · ${c.unlocked ? c.title : "???"}`),
        c.unlocked ? c.text.map(p => el("p", {}, p)) : el("p", {}, `Se débloque au niveau ${c.level}.`))))));
})().catch(err => root.replaceChildren(el("p", {class: "msg err"}, `Le moteur ne répond pas : ${err.message}`)));
</script>
</body>
</html>
