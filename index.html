<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCEND · Accueil</title>
<link rel="stylesheet" href="ascend.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("ascend-theme");document.documentElement.dataset.theme=/^(sombre|encre|fenetre)$/.test(t)?t:"equilibre"}catch(e){document.documentElement.dataset.theme="equilibre"}</script>
</head>
<body>
<div class="scr">
<div class="stars"></div><div class="speed"></div><div class="halftone"></div>
<main id="root" class="page g3" aria-live="polite"><p class="empty">Chargement…</p></main>
</div>

<div class="dialog" id="swap" hidden>
<div class="sys" role="dialog" aria-modal="true" aria-labelledby="swap-title">
<div class="st"><i>!</i><span id="swap-title">Changer de quête</span></div>
<div style="padding:14px 18px 0">
<p class="tx2" id="swap-q" style="margin:0 0 10px"></p>
<label class="f">Pourquoi ?<select id="swap-reason"></select></label>
<p class="tx3" style="font-size:14px">Le Système te proposera une quête adaptée. Ta Discipline n'est pas touchée.</p>
<div style="display:flex;gap:12px;margin-top:8px"><button class="btn sm" id="swap-ok" type="button">Changer</button><button class="btn gh sm" id="swap-cancel" type="button">Annuler</button></div>
<div class="msg" id="swap-msg"></div>
</div>
</div>
</div>

<script src="pont.js"></script>
<script src="app.js"></script>
<script>
"use strict";
const root = document.getElementById("root");
let current = null;

async function onboarding() {
  mount("index.html", null);
  const meta = await api("/api/meta");
  const wtxt = w => Object.keys(w).length ? Object.entries(w).map(([s, k]) => `${s} ×${String(k).replace(".", ",")}`).join(" · ") : "Toutes les stats à égalité";
  root.className = "page";
  root.replaceChildren(el("section", {class: "sys", style: "max-width:560px;margin:40px auto;width:100%"},
    el("div", {class: "st"}, el("i", {}, "!"), "Éveil du héros"),
    el("form", {style: "padding:16px 18px", onsubmit: async e => {
      e.preventDefault();
      const f = new FormData(e.target);
      const interests = f.getAll("interest");
      if (!interests.length) return message(document.getElementById("on-msg"), "Coche au moins une stat qui t'intéresse.", true);
      try {
        await api("/api/hero", {name: f.get("name"), bodyweight: Number(f.get("bodyweight")), hero_class: f.get("hero_class")});
        await api("/api/programs", {interests});
        location.href = "programmes.html";
      } catch (err) { message(document.getElementById("on-msg"), err.message, true); }
    }},
      el("p", {class: "tx2", style: "margin-top:0"}, "Bienvenue. Tes données restent sur cet appareil."),
      el("fieldset", {class: "fs", style: "margin-bottom:14px"},
        el("legend", {class: "lab"}, "Quel univers te ressemble ?"),
        el("p", {class: "tx3", style: "font-size:14px;margin:0 0 8px"}, "Touche un univers puis un style : l'appli change tout de suite. Tu pourras en changer quand tu veux (Profil, ou en haut de chaque page)."),
        styleChooser()),
      el("div", {class: "fields"},
        el("label", {class: "f"}, "Nom du héros", el("input", {name: "name", required: true, maxlength: 40, autocomplete: "nickname"})),
        el("label", {class: "f"}, "Poids de corps (kg)", el("input", {name: "bodyweight", type: "number", min: 25, max: 300, step: "0.1", required: true}))),
      el("fieldset", {class: "fs", style: "margin-bottom:14px"},
        el("legend", {class: "lab"}, "Classe"),
        el("p", {class: "tx3", style: "font-size:14px;margin:0 0 8px"}, "Elle pèse sur ton rang global. Aucune stat n'est verrouillée, et tu pourras en changer une fois par saison."),
        el("label", {class: "f"}, "Choisis ta classe",
          el("select", {name: "hero_class"}, meta.classes.map(c => el("option", {value: c.name, selected: c.name === "Équilibré"}, `${c.name} — ${wtxt(c.weights)}`))))),
      el("fieldset", {class: "fs", style: "margin-bottom:14px"},
        el("legend", {class: "lab"}, "Ce qui t'intéresse"),
        el("p", {class: "tx3", style: "font-size:14px;margin:0 0 8px"}, "Tu ne passeras l'évaluation de départ que pour ces stats. Les autres restent ouvertes : tu pourras les ajouter plus tard (onglet Programmes)."),
        el("div", {style: "display:flex;flex-wrap:wrap;gap:8px"}, ["Force", "Endurance", "Agilité", "Vitalité", "Intelligence", "Mental", "Expédition"].map(st =>
          el("label", {class: "chip", style: "cursor:pointer;min-height:36px;display:inline-flex;align-items:center;gap:6px;text-transform:none"},
            el("input", {type: "checkbox", name: "interest", value: st}), st)))),
      el("button", {class: "btn", type: "submit"}, "Commencer"),
      el("div", {class: "msg", id: "on-msg"}))),
    el("details", {style: "max-width:560px;margin:0 auto 40px;width:100%"},
      el("summary", {class: "tx2", style: "cursor:pointer"}, "J'ai déjà un héros sur un autre appareil"),
      transferBox(false)));
}

function statsPanel(s) {
  return el("section", {class: "pn pb col", "aria-labelledby": "fiche"},
    el("div", {class: "ph", id: "fiche"}, "Fiche du héros"),
    el("div", {style: "display:flex;gap:14px;align-items:center"},
      rankBadge(s.hero.rank, 64),
      el("div", {}, el("div", {class: "h2"}, s.hero.name),
        el("div", {style: "display:flex;gap:8px;margin-top:6px"},
          el("span", {class: "chip g"}, `Niveau ${s.hero.level}`),
          el("span", {class: "chip v"}, `Rang global ${s.hero.rank}`)),
        el("div", {class: "tx2", style: "font-size:15px;margin-top:6px"}, s.hero.hero_class),
        el("div", {class: "tx3", style: "font-size:14px;margin-top:6px"}, `${fmt(s.hero.total_xp)} XP gagnées sur tes performances réelles`))),
    el("div", {}, s.stats.map(st => el("div", {class: "srow"},
      el("div", {class: "sn"},
        el("b", {}, st.name),
        el("div", {class: "bar" + (st.rank === "S" ? " go" : ""), role: "progressbar", "aria-label": `${st.name} vers le rang suivant`,
          "aria-valuenow": Math.round(st.frac * 100), "aria-valuemin": 0, "aria-valuemax": 100},
          el("i", {style: `--w:${Math.round(st.frac * 100)}%`})),
        el("small", {class: "tx3", style: "font-size:14px"}, st.trial_needed
          ? el("a", {href: st.need && st.need.startsWith("palier") ? "quiz.html#matieres" : "heros.html", class: "gold"}, `${fmt(st.xp)} XP · ${st.need || `épreuve du rang ${st.trial_needed} requise`}`)
          : st.rank === "S" ? `${fmt(st.xp)} XP` : `${fmt(st.xp)} XP · encore ${fmt(st.left)}`,
          st.convalescence ? el("a", {href: "profil.html", class: "chip ice", style: "margin-left:8px"}, "Gelée")
            : st.dormant ? el("a", {href: "profil.html", class: "chip warn", style: "margin-left:8px"}, "En sommeil") : null)),
      rankBadge(st.rank)))),
    el("div", {style: "display:flex;align-items:center;gap:16px;padding-top:8px;border-top:1px solid rgba(233,196,106,.25)"},
      el("div", {class: "ring", style: `--p:${s.discipline.value};width:72px;height:72px`}, el("i"), el("b", {style: "font-size:17px"}, `${Math.round(s.discipline.value)}%`)),
      el("div", {}, el("div", {class: "lab"}, "Discipline"),
        el("div", {class: "tx2", style: "font-size:15px"}, `Quêtes du jour accomplies sur 28 jours`),
        el("div", {class: "tx2", style: "font-size:15px"}, `Série : ${s.discipline.streak} jour${s.discipline.streak > 1 ? "s" : ""}`))));
}

function questsPanel(s) {
  const done = s.quests.filter(q => q.status === "faite").length;
  return el("section", {class: "col"},
    el("div", {class: "sys"},
      el("div", {class: "st"}, el("i", {}, "!"), "Quêtes du jour"),
      el("div", {style: "padding:12px 18px 16px"},
        s.rested ? el("p", {class: "tx2"}, "Jour de repos déclaré. Récupère bien : ça ne change rien à ta Discipline.") : null,
        s.quests.map(q => el("div", {class: "q" + (q.status === "faite" ? " done" : "")},
          q.status === "faite" && q.completed_by
            ? el("button", {class: "box", type: "button", title: "Annuler la saisie qui a validé cette quête",
                "aria-label": `Quête faite : ${q.title}. Annuler la saisie qui l'a validée`,
                onclick: () => undoEntry(q.completed_by, `Annuler la saisie qui a validé « ${q.title} » ?`)}, "✓")
            : el("span", {class: "box", "aria-hidden": "true"}, q.status === "faite" ? "✓" : ""),
          el("div", {style: "flex:1"},
            el("div", {class: "s"}, q.stat),
            el("div", {class: "t"}, q.title, el("span", {class: "sr-only"}, q.status === "faite" ? " (faite)" : "")),
            q.status === "faite" ? null : el("div", {class: "acts"},
              el("a", {class: "btn sm", href: `saisie.html?quest=${q.id}`}, "Saisir"),
              el("button", {class: "lnk", type: "button", onclick: () => openSwap(q)}, "Changer de quête"))))),
        el("div", {class: "bar", style: "margin:12px 0 6px"}, el("i", {style: `--w:${Math.round(100 * done / Math.max(1, s.quests.length))}%`})),
        el("div", {class: "tx2", style: "font-size:14px"}, `${done} / ${s.quests.length} accomplies · la cible suit ton rang`))),
    el("div", {class: "pn pb"},
      el("div", {class: "ph", style: "margin-bottom:8px"}, "Repos"),
      el("p", {class: "tx2", style: "margin:0 0 10px"}, "Besoin de souffler ? Jusqu'à 2 jours de repos par semaine ne font jamais baisser la Discipline."),
      el("button", {class: "btn gh sm", type: "button", disabled: s.rested, onclick: async () => {
        const r = await api("/api/rest", {}); await load();
        message(document.getElementById("info"), r.message, !r.neutral);
      }}, s.rested ? "Repos déclaré" : "Déclarer un jour de repos")));
}

function sidePanel(s) {
  const missing = (s.interests || []).filter(x => !s.hero.assessed.includes(x));
  return el("section", {class: "col"},
    !(s.interests || []).length ? el("div", {class: "sys"},
      el("div", {class: "st"}, el("i", {}, "!"), "Tes centres d'intérêt"),
      el("div", {style: "padding:12px 18px 16px"},
        el("p", {class: "tx2", style: "margin-top:0"}, "Dis-nous quelles stats t'intéressent : tu n'évalueras que celles-là, et ASCEND te proposera des programmes adaptés."),
        el("a", {class: "btn sm", href: "programmes.html"}, "Choisir mes stats"))) : null,
    missing.length ? el("div", {class: "sys"},
      el("div", {class: "st"}, el("i", {}, "!"), "Évaluation de départ"),
      el("div", {style: "padding:12px 18px 16px"},
        el("p", {class: "tx2", style: "margin-top:0"}, `Pas encore faite : ${missing.join(", ")}. Elle fixe ton rang de départ réel et débloque les programmes adaptés à ton niveau.`),
        el("a", {class: "btn sm", href: "programmes.html"}, "Évaluations et programmes"))) : null,
    s.coach && s.coach.length ? el("div", {class: "pn pb"},
      el("div", {class: "ph", style: "margin-bottom:8px"}, "Le coach du jour"),
      el("ul", {class: "coach"}, s.coach.map(t => el("li", {class: "k-" + t.kind},
        el("span", {class: "ic", "aria-hidden": "true"}, {alerte: "⚠", conseil: "💡", "défi": "🏁", programme: "📅", rappel: "⏰", bravo: "★"}[t.kind] || "•"),
        el("a", {href: t.link}, t.text))))) : null,
    journalPanel(s.journal),
    el("div", {class: "pn pb"},
      el("div", {class: "ph", style: "margin-bottom:8px"}, "Saisie rapide"),
      el("p", {class: "tx2", style: "margin:0 0 10px"}, "Enregistre une activité en quelques secondes. Le Système t'explique chaque point d'XP."),
      el("a", {class: "btn gh sm", href: "saisie.html"}, "Saisir une activité")),
    el("div", {class: "pn pb"},
      el("div", {class: "ph", style: "margin-bottom:8px"}, "Rappel"),
      el("p", {class: "tx3", style: "margin:0;font-size:14px"}, "Récompenses cosmétiques uniquement. Aucun achat ne fait gagner d'XP.")));
}

let journalDay = null;                 // null = aujourd'hui
function journalPanel(j) {
  const entries = (j && j.entries) || [];
  const shown = new Date((j && j.day || current.today) + "T12:00:00");
  const isToday = !journalDay || journalDay === current.today;
  const go = async delta => {
    const d = new Date(shown); d.setDate(d.getDate() + delta);
    const iso = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
    journalDay = iso >= current.today ? null : iso;
    await load();
  };
  const title = isToday ? "Journal du jour" : `Journal du ${shown.toLocaleDateString("fr-FR", {weekday: "long", day: "numeric", month: "long"})}`;
  return el("div", {class: "pn pb"},
    el("div", {class: "ph", style: "margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;gap:8px"},
      el("span", {}, title),
      el("span", {style: "display:flex;gap:4px"},
        el("button", {class: "btn gh sm", type: "button", "aria-label": "Jour précédent", onclick: () => go(-1)}, "◀"),
        el("button", {class: "btn gh sm", type: "button", "aria-label": "Jour suivant", disabled: isToday, onclick: () => go(1)}, "▶"))),
    entries.length ? el("ul", {class: "jr"}, entries.slice().reverse().map(e => el("li", {},
      el("div", {class: "jl"},
        el("span", {}, e.label),
        e.granted !== undefined ? el("b", {class: "gold"}, `+${fmt(e.granted)} XP`) : null),
      el("div", {class: "acts"},
        e.type === "activity" ? el("a", {class: "lnk", href: `saisie.html?edit=${e.id}`}, "Modifier") : null,
        el("button", {class: "lnk", type: "button", onclick: () => undoEntry(e.id, `Annuler « ${e.label} » ?`)}, "Annuler")))))
      : el("p", {class: "empty", style: "margin:0"}, isToday ? "Aucune saisie aujourd'hui." : "Aucune saisie ce jour-là."),
    el("p", {class: "tx3", style: "font-size:14px;margin:8px 0 0"}, "Une erreur ? Modifie ou annule : l'XP, les quêtes et la Discipline sont recalculées."));
}

async function undoEntry(id, question) {
  if (!confirm(question + "\nL'XP et les quêtes seront recalculées.")) return;
  try {
    await api(`/api/events/${id}/delete`, {});
    await load();
    message(document.getElementById("info"), "Saisie annulée.");
  } catch (err) { message(document.getElementById("info"), err.message, true); }
}

let swapQuest = null;
function openSwap(q) {
  swapQuest = q;
  document.getElementById("swap-q").textContent = q.title;
  const sel = document.getElementById("swap-reason");
  sel.replaceChildren(...q.reasons.map(r => el("option", {value: r}, r)));
  message(document.getElementById("swap-msg"), "");
  document.getElementById("swap").hidden = false;
  sel.focus();
}
document.getElementById("swap-cancel").onclick = () => { document.getElementById("swap").hidden = true; };
document.getElementById("swap-ok").onclick = async () => {
  try {
    const r = await api(`/api/quests/${swapQuest.id}/swap`, {reason: document.getElementById("swap-reason").value});
    document.getElementById("swap").hidden = true;
    await load();
    message(document.getElementById("info"), r.message);
  } catch (err) { message(document.getElementById("swap-msg"), err.message, true); }
};
document.addEventListener("keydown", e => { if (e.key === "Escape") document.getElementById("swap").hidden = true; });

async function load() {
  try {
    current = await api("/api/state");
    if (!current.hero) return onboarding();
    [current.journal, current.coach] = await Promise.all([api("/api/journal" + (journalDay ? `?day=${journalDay}` : "")),
      api("/api/coach").then(r => r.tips).catch(() => [])]);
    mount("index.html", current);
    root.className = "page g3";
    root.replaceChildren(statsPanel(current), el("div", {class: "col"}, el("div", {class: "msg", id: "info"}), questsPanel(current)), sidePanel(current));
  } catch (err) {
    root.replaceChildren(el("p", {class: "msg err"}, `Le moteur ne répond pas : ${err.message}`));
  }
}
load();
</script>
<style>.coach{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.coach li{display:flex;gap:10px;align-items:flex-start;line-height:1.4}
.coach .ic{width:20px;flex:none;text-align:center;color:var(--gold)}
.coach a{color:var(--tx2);text-decoration:none}
.coach a:hover,.coach a:focus{color:var(--tx);text-decoration:underline}
.coach .k-alerte a{color:var(--tx)}</style>
<style>.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}</style>
</body>
</html>
