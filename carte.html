<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#14161c">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASCEND · Carte du monde</title>
<link rel="stylesheet" href="ascend.css">
<link rel="stylesheet" href="app.css">
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="styles.css">
<script>try{var t=localStorage.getItem("ascend-theme");document.documentElement.dataset.theme=/^(sombre|encre|fenetre|anime|carnet|claire)$/.test(t)?t:"equilibre"}catch(e){document.documentElement.dataset.theme="equilibre"}</script>
<style>
.regl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.regl a{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--line-soft);text-decoration:none;color:var(--tx)}
.regl a:hover,.regl a:focus-visible{border-color:var(--gold)}
.regl .dot{width:12px;height:12px;border-radius:50%;flex:none}
.regl .nm{flex:1;font:700 15px var(--fu)}
.regl small{display:block;color:var(--tx3);font:600 13px var(--fu)}
.places{display:flex;flex-wrap:wrap;gap:6px}
</style>
</head>
<body>
<div class="scr">
<div class="stars"></div><div class="speed"></div><div class="halftone"></div>
<main class="page g2" id="root"><p class="empty">Chargement…</p></main>
</div>
<script src="pont.js"></script>
<script src="app.js"></script>
<script>
"use strict";
const root = document.getElementById("root");
// Contours provisoires des 7 régions (la carte illustrée viendra plus tard).
const SHAPES = {
  "Force":        {d: "M60 300 L150 240 L250 260 L270 360 L180 420 L80 400 Z", x: 165, y: 330},
  "Endurance":    {d: "M250 260 L380 230 L470 280 L450 380 L330 400 L270 360 Z", x: 365, y: 315},
  "Agilité":      {d: "M150 240 L200 120 L320 90 L380 230 L250 260 Z", x: 265, y: 180},
  "Vitalité":     {d: "M470 280 L590 250 L700 300 L680 420 L560 450 L450 380 Z", x: 570, y: 350},
  "Intelligence": {d: "M380 230 L320 90 L460 60 L560 120 L590 250 L470 280 Z", x: 460, y: 170},
  "Mental":       {d: "M560 120 L700 90 L760 200 L700 300 L590 250 Z", x: 655, y: 190},
  "Expédition":   {d: "M180 420 L270 360 L330 400 L450 380 L560 450 L470 480 L260 480 Z", x: 360, y: 440},
};

function mapSvg(m) {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 820 520");
  svg.setAttribute("role", "group");
  svg.setAttribute("aria-label", "Carte des régions du monde ASCEND");
  const add = (tag, attrs, parent = svg) => { const n = document.createElementNS(NS, tag); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); parent.append(n); return n; };
  add("rect", {x: 0, y: 0, width: 820, height: 520, fill: "#141821", rx: 8});
  for (const r of m.regions) {
    const s = SHAPES[r.stat], color = STAT_COLORS[r.stat];
    const a = add("a", {href: `force.html#${encodeURIComponent(r.stat)}`, class: "reg",
      "aria-label": `${r.name}, région ${r.stat}, rang ${r.rank}${r.dormant ? ", en sommeil" : ""}${r.convalescence ? ", gelée" : ""}`});
    add("path", {d: s.d, fill: color, "fill-opacity": r.explored ? 0.25 + 0.6 * Math.min(1, "EDCBAS".indexOf(r.rank) / 5 + 0.1) : 0.08,
      stroke: r.explored ? color : "#555", "stroke-width": 2, "stroke-dasharray": r.dormant ? "6 5" : "none"}, a);
    if (!r.explored) add("path", {d: s.d, fill: "url(#fog)"}, a);
    const t = add("text", {x: s.x, y: s.y - 6, "text-anchor": "middle", fill: "#F2EAD8", "font-family": "Cinzel", "font-size": 15, "font-weight": 700}, a);
    t.textContent = r.name;
    const t2 = add("text", {x: s.x, y: s.y + 14, "text-anchor": "middle", fill: "#CDAA5C", "font-family": "Rajdhani", "font-size": 14, "font-weight": 700}, a);
    t2.textContent = `${r.stat} · ` + (r.convalescence ? (r.explored ? `rang ${r.rank} · gelée` : "gelée")
      : !r.explored ? "inexplorée" : `rang ${r.rank}${r.dormant ? " · en sommeil" : ""}`);
  }
  const defs = add("defs", {});
  const pat = add("pattern", {id: "fog", width: 10, height: 10, patternUnits: "userSpaceOnUse"}, defs);
  add("path", {d: "M0 10 L10 0", stroke: "#8a8f99", "stroke-opacity": 0.35, "stroke-width": 1.5}, pat);
  svg.prepend(defs);
  return svg;
}

function render(m) {
  root.replaceChildren(
    el("section", {class: "col"},
      el("nav", {class: "subnav", "aria-label": "Carte et lieux"},
        el("a", {href: "carte.html", class: "on", "aria-current": "page"}, "Carte du monde"), el("a", {href: "lieux.html"}, "Lieux et matériel")),
      el("div", {class: "pn pb"},
        el("div", {class: "slant", style: "align-self:flex-start;margin-bottom:12px"}, el("span", {}, "Carte du monde")),
        el("div", {class: "map"}, mapSvg(m)),
        el("p", {class: "tx3", style: "font-size:13px;margin:8px 0 0"},
          "Plus une région est vive, plus ton rang y est haut. Hachures : jamais explorée. Pointillés : en sommeil. Carte provisoire en attendant l'illustration."))),
    el("section", {class: "col"},
      el("div", {class: "pn pb"},
        el("div", {class: "ph", style: "margin-bottom:8px"}, `Régions · rang global ${m.rank} · niveau ${m.level}`),
        el("ul", {class: "regl"}, m.regions.map(r => el("li", {}, el("a", {href: `force.html#${encodeURIComponent(r.stat)}`},
          el("span", {class: "dot", style: `background:${STAT_COLORS[r.stat]}`}),
          el("span", {class: "nm"}, r.name, el("small", {}, `${r.stat} · ${fmt(r.xp)} XP` +
            (r.trial_needed ? ` · ${r.need || `épreuve ${r.trial_needed} à réussir`}` : ""))),
          r.convalescence ? el("span", {class: "chip ice"}, "Gelée") : r.dormant ? el("span", {class: "chip warn"}, "Sommeil") : null,
          rankBadge(r.rank, 28)))))),
      el("div", {class: "pn pb"},
        el("div", {class: "ph", style: "margin-bottom:8px"}, `Lieux découverts (${m.places.length})`),
        m.places.length ? el("div", {class: "places"}, m.places.map(p => el("span", {class: "chip"}, p)))
          : el("p", {class: "empty", style: "margin:0"}, "Saisis une expédition avec un nom de lieu pour l'ajouter à ta carte."))));
}

(async () => {
  const state = await api("/api/state");
  if (!state.hero) { location.href = "index.html"; return; }
  mount("carte.html", state);
  render(await api("/api/map"));
})().catch(err => root.replaceChildren(el("p", {class: "msg err"}, `Le moteur ne répond pas : ${err.message}`)));
</script>
</body>
</html>
